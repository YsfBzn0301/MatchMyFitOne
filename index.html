<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MatchMyFit</title>
<meta name="description" content="MatchMyFit - build outfits with colors and clothes that match.">
<meta name="theme-color" content="#f6f5fa">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MatchMyFit">
<script>
// Resolve theme before first paint (no flash)
(function () {
  var p = 'system';
  try { p = localStorage.getItem('mmf-theme') || 'system'; } catch (e) {}
  var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  var r = document.documentElement;
  r.dataset.theme = dark ? 'dark' : 'light';
  r.dataset.themePref = p;
  document.querySelector('meta[name="theme-color"]').content = dark ? '#0e0d14' : '#f6f5fa';
})();
</script>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<!-- Splash: visible immediately, removed by JS -->
<div id="splash" class="splash" role="status" aria-live="polite">
  <div class="splash-glow"></div>
  <div class="splash-inner">
    <svg class="splash-logo" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="sc sc1" cx="44" cy="52" r="28"/>
      <circle class="sc sc2" cx="76" cy="52" r="28"/>
      <circle class="sc sc3" cx="60" cy="76" r="28"/>
      <path class="hanger" pathLength="1" d="M60 38 V33 C60 27 66 25 69 29 C72 33 66 36 60 38 L22 64 Q16 70 24 70 H96 Q104 70 98 64 L60 38"/>
    </svg>
    <h1 class="wordmark" aria-label="MatchMyFit"><span style="--i:0">M</span><span style="--i:1">a</span><span style="--i:2">t</span><span style="--i:3">c</span><span style="--i:4">h</span><span class="g" style="--i:5">M</span><span class="g" style="--i:6">y</span><span style="--i:7">F</span><span style="--i:8">i</span><span style="--i:9">t</span></h1>
    <p class="splash-tag" data-i18n="splash.tagline"></p>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="0.55" stop-color="#ff6fa5"/><stop offset="1" stop-color="#ffb06b"/>
    </linearGradient>
  </defs>
</svg>

<div id="app">
  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="#7c5cff"/><circle cx="20" cy="13" r="8" fill="#ff6fa5" opacity=".85"/><circle cx="16" cy="20" r="8" fill="#ffb06b" opacity=".85"/></svg>
      <span class="brand-name">MatchMyFit</span>
    </div>
    <div class="header-actions">
      <button id="help-btn" class="icon-btn" type="button" data-i18n-attr="aria-label:tour.help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><path d="M12 17.2h.01"/></svg></button>
      <button id="lang-btn" class="pill-btn" type="button" data-i18n-attr="aria-label:settings.title"><span id="lang-flag">🌐</span><span id="lang-code"></span></button>
      <button id="theme-btn" class="icon-btn" type="button" data-i18n-attr="aria-label:theme.toggle">
        <svg class="ti ti-system" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M8 20h8M12 16v4"/></svg>
        <svg class="ti ti-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ti ti-dark" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <!-- COLORS -->
    <section id="view-colors" class="view" data-view="colors">
      <div class="page-head"><h1 data-i18n="colors.title"></h1><p data-i18n="colors.subtitle"></p></div>
      <div class="seg" role="group">
        <button type="button" class="seg-btn is-on" data-mode="single" data-i18n="colors.modeSingle"></button>
        <button type="button" class="seg-btn" data-mode="compare" data-i18n="colors.modeCompare"></button>
      </div>
      <div class="card"><div id="color-grid" class="sw-grid"></div></div>
      <div id="color-result" class="result"></div>
    </section>

    <!-- CLOTHING -->
    <section id="view-clothing" class="view" data-view="clothing" hidden>
      <div class="page-head"><h1 data-i18n="clothing.title"></h1><p data-i18n="clothing.subtitle"></p></div>
      <div class="gender-slot"></div>
      <div class="chip-label" data-i18n="clothing.category"></div>
      <div id="cat-chips" class="chips"></div>
      <div class="chip-label" data-i18n="clothing.style"></div>
      <div id="style-filter" class="chips"></div>
      <div id="item-grid" class="tile-grid"></div>
    </section>

    <!-- CAMERA -->
    <section id="view-camera" class="view" data-view="camera" hidden>
      <div class="page-head"><h1 data-i18n="camera.title"></h1><p data-i18n="camera.subtitle"></p></div>
      <div id="cam-stage" class="cam-stage" data-state="idle">
        <video id="cam-video" playsinline muted autoplay></video>
        <div class="cam-overlay cam-idle">
          <div class="cam-icon"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg></div>
          <p data-i18n="camera.intro"></p>
          <button id="cam-start" class="btn primary" type="button" data-i18n="camera.start"></button>
          <button class="btn ghost cam-upload-btn" type="button" data-i18n="camera.upload"></button>
        </div>
        <div class="cam-overlay cam-starting"><div class="spinner"></div><p data-i18n="camera.starting"></p></div>
        <div class="cam-overlay cam-error">
          <div class="cam-icon warn"><svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.01"/><path d="M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
          <p id="cam-error-msg"></p>
          <button id="cam-retry" class="btn primary" type="button" data-i18n="camera.retry"></button>
          <button class="btn ghost cam-upload-btn" type="button" data-i18n="camera.upload"></button>
        </div>
        <div class="cam-live">
          <div class="cam-ring"><i></i></div>
          <div class="cam-chip"><span class="cam-chip-dot"></span><span id="cam-chip-name"></span><code id="cam-chip-hex"></code></div>
          <div class="cam-tools">
            <button id="cam-switch" class="cam-tool" type="button" data-i18n-attr="aria-label:camera.switch"><svg viewBox="0 0 24 24"><path d="M3 7h13l-3-3M21 17H8l3 3"/></svg></button>
            <button id="cam-torch" class="cam-tool" type="button" hidden data-i18n-attr="aria-label:camera.torch"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button>
            <button id="cam-stop" class="cam-tool" type="button" data-i18n-attr="aria-label:camera.stop"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          </div>
          <p class="cam-hint" data-i18n="camera.pointHint"></p>
          <button id="cam-shutter" class="shutter" type="button" data-i18n-attr="aria-label:camera.capture"><span></span></button>
        </div>
      </div>
      <input id="cam-file" type="file" accept="image/*" capture="environment" hidden>
      <div id="cam-result" class="result"></div>
    </section>

    <!-- OUTFIT -->
    <section id="view-outfit" class="view" data-view="outfit" hidden>
      <div class="page-head"><h1 data-i18n="outfit.title"></h1><p data-i18n="outfit.subtitle"></p></div>
      <div class="card figure-card"><div id="outfit-fig" class="fig" role="group" data-i18n-attr="aria-label:outfit.preview"></div></div>
      <div class="card score-card">
        <div class="score-row">
          <div id="outfit-ring"></div>
          <div class="score-text"><div class="eyebrow" data-i18n="outfit.score"></div><div id="outfit-verdict" class="verdict"></div></div>
        </div>
        <ul id="outfit-tips" class="tips"></ul>
      </div>
      <div class="chip-label" data-i18n="gender.title"></div>
      <div class="gender-slot"></div>
      <div class="chip-label" data-i18n="outfit.style"></div>
      <div id="outfit-style" class="chips"></div>
      <div class="btn-row">
        <button id="o-suggest" class="btn primary" type="button"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg><span data-i18n="outfit.suggest"></span></button>
        <button id="o-shuffle" class="btn soft" type="button"><svg viewBox="0 0 24 24"><path d="M3 7h3c5 0 6 10 11 10h4M3 17h3c1.6 0 2.8-1 3.8-2.4M21 7h-4c-1.6 0-2.8 1-3.8 2.4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg><span data-i18n="outfit.shuffle"></span></button>
      </div>
      <div id="slot-list" class="slot-list"></div>
      <div class="btn-row">
        <button id="o-save" class="btn soft" type="button" data-i18n="outfit.save"></button>
        <button id="o-clear" class="btn ghost" type="button" data-i18n="outfit.clear"></button>
      </div>
      <h2 class="section-title" data-i18n="outfit.saved"></h2>
      <div id="saved-list" class="saved-list"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <span class="tab-ind" aria-hidden="true"></span>
    <button class="tab is-on" type="button" data-view="colors"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-.9 2-1.8 0-1.2-1-1.6-1-2.7 0-1 .8-1.5 1.8-1.5H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.2" r="1"/><circle cx="15" cy="7.2" r="1"/></svg><span data-i18n="nav.colors"></span></button>
    <button class="tab" type="button" data-view="clothing"><svg viewBox="0 0 24 24"><path d="M8.5 3 3 6l2 4 2-1v11h10V9l2 1 2-4-5.5-3a3.6 3.6 0 0 1-7 0z"/></svg><span data-i18n="nav.clothing"></span></button>
    <button class="tab" type="button" data-view="camera"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.400h6.800L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg><span data-i18n="nav.camera"></span></button>
    <button class="tab" type="button" data-view="outfit"><svg viewBox="0 0 24 24"><path d="M12 7V5.500A2.2 2.2 0 1 1 14.2 7.700L21 13.500a1.3 1.3 0 0 1-.8 2.300H3.800a1.3 1.3 0 0 1-.8-2.300l6.8-5.8"/><path d="M5 19h14"/></svg><span data-i18n="nav.outfit"></span></button>
  </nav>
</div>

<!-- Bottom sheet -->
<div id="sheet" class="sheet" hidden aria-hidden="true">
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="sheet-grab"></div>
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-btn" type="button" data-close data-i18n-attr="aria-label:common.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
